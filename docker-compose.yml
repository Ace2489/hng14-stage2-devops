services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU}"
          memory: "${REDIS_MEM}"

  api:
    image: "${API_IMAGE}"
    build:
      context: ./api
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - API_PORT=${API_PORT}
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${API_CPU}"
          memory: "${API_MEM}"

  worker:
    image: "${WORKER_IMAGE}"
    build:
      context: ./worker
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU}"
          memory: "${WORKER_MEM}"

  frontend:
    image: "${FRONTEND_IMAGE}"
    build:
      context: ./frontend
    environment:
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    networks:
      - internal
      - exposed
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU}"
          memory: "${FRONTEND_MEM}"

networks:
  internal:
    driver: bridge
    internal: true
  exposed:
    driver: bridge
